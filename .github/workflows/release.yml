name: Build, test and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: pwsh

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Validate release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          [xml]$project = Get-Content -Raw bridge/AgentStatusBridge.csproj
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Invalid release version.' }
          if ($env:REF_TYPE -eq 'tag' -and $env:REF_NAME -ne "v$version") {
            throw 'Release tag must match the project version.'
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          $commit = git rev-parse HEAD
          if ($LASTEXITCODE) { throw 'Cannot resolve checked-out commit.' }
          "commit=$commit" >> $env:GITHUB_OUTPUT
      - name: Build self-contained Windows package
        run: ./build.ps1 -SelfContained
      - name: Test HTTP, SSE and native plugin
        run: ./tests/Integration.ps1
      - name: Test isolated installation and upgrades
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: ./tests/Installation.ps1 -PackageDirectory "dist/TrafficMonitorAgentStatus-v$env:VERSION-win-x64"
      - name: Test release publishing without network writes
        run: ./tests/ReleasePublishing.ps1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-release
          path: |
            dist/TrafficMonitorAgentStatus-v${{ steps.version.outputs.version }}-win-x64.zip
            dist/TrafficMonitorAgentStatus-v${{ steps.version.outputs.version }}-win-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: build
    if: >-
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.build.outputs.commit }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: windows-release
          path: dist
      - name: Publish verified package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_COMMIT: ${{ needs.build.outputs.commit }}
          VERSION: ${{ needs.build.outputs.version }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          $channel = if ($env:REF_TYPE -eq 'tag') { 'stable' } else { 'development' }
          ./tools/Publish-Release.ps1 -Channel $channel -Repository $env:GH_REPO -Commit $env:SOURCE_COMMIT -Version $env:VERSION
